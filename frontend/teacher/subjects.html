<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Subjects – SmartCampus</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/teacher.css" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body data-page="subjects">
<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="logo">🎓</span> Smart<span>Campus</span></div>
        <nav>
            <a href="dashboard.html"><span class="ico">🏠</span> Dashboard</a>
            <a href="subjects.html"><span class="ico">📚</span> My Subjects</a>
            <a href="mark-attendance.html"><span class="ico">✅</span> Mark Attendance</a>
            <a href="attendance-history.html"><span class="ico">🕘</span> History & Reports</a>
        </nav>
        <div class="logout"><button onclick="logout()">⎋ Logout</button></div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:14px">
                <button class="hamburger" onclick="toggleSidebar()">☰</button>
                <h2>Subject Management</h2>
            </div>
            <div class="user-chip"><span class="avatar">T</span> <span id="userName">teacher</span></div>
        </div>

        <div class="content">
            <div class="alert" id="alertBox"></div>

            <div class="panel" style="margin-top:0">
                <div class="panel-head"><h3>My Subjects</h3></div>
                <div class="panel-body">
                    <div class="grid grid-3" id="mySubjects"><p class="muted">Loading…</p></div>
                </div>
            </div>

            <div class="grid grid-2" style="margin-top:24px">
                <!-- Assign existing subject -->
                <div class="panel" style="margin-top:0">
                    <div class="panel-head"><h3>Add an Existing Subject</h3></div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>Available subjects</label>
                            <select class="form-control" id="assignSelect"></select>
                        </div>
                        <button class="btn btn-primary" id="assignBtn" style="background:#0d9488">Assign to me</button>
                    </div>
                </div>

                <!-- Create new subject -->
                <div class="panel" style="margin-top:0">
                    <div class="panel-head"><h3>Create a New Subject</h3></div>
                    <div class="panel-body">
                        <form id="newSubjectForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Subject Code</label>
                                    <input class="form-control" name="subject_code" placeholder="CS303" required />
                                </div>
                                <div class="form-group">
                                    <label>Subject Name</label>
                                    <input class="form-control" name="subject_name" placeholder="Operating Systems" required />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Course</label>
                                    <input class="form-control" name="course" placeholder="B.Tech" required />
                                </div>
                                <div class="form-group">
                                    <label>Branch</label>
                                    <input class="form-control" name="branch" placeholder="CSE" required />
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Semester</label>
                                <input class="form-control" name="semester" type="number" min="1" max="8" value="3" />
                            </div>
                            <button class="btn btn-primary" type="submit" style="background:#0d9488">Create & Assign</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/script.js"></script>
<script src="../js/teacher.js"></script>
</body>
</html>
